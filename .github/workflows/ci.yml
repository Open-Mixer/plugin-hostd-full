name: ci

# The heavy jobs, by workflow_dispatch only (never on a push or a pull request): the RPM and the DEB built as the
# release builds them (Open-Mixer/.github's build-rpm and build-deb actions), published nowhere. A pull request is
# checked by dispatching this workflow on its head before it merges (gh workflow run ci.yml --ref <branch>). Its fast
# checks are lint.yml's make check: the floors-only ranges (every dependency a floor and no ceiling, the same in the
# spec and debian/control) and the kept-install check's own self-test.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  rpm:
    name: RPM (fc45), built as the release builds it
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: fedora:45
    steps:
      - name: Install the build tools
        run: dnf install -y --setopt=install_weak_deps=False git rpm-build dnf5-plugins make python3
      - uses: actions/checkout@v4
      - uses: Open-Mixer/.github/.github/actions/build-rpm@openmixer-v1

  deb:
    name: DEB (trixie), built and linted as the release builds it
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: debian:trixie
    steps:
      - name: Install the build tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates git dpkg-dev debhelper build-essential lintian python3
      - uses: actions/checkout@v4
      - uses: Open-Mixer/.github/.github/actions/build-deb@openmixer-v1
