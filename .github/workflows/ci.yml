name: ci

# By workflow_dispatch: the RPM and the DEB built as the release builds them (Open-Mixer/.github's build-rpm and
# build-deb actions), published nowhere. Delivery pipeline §12 (Open-Mixer/plugin-hostd-full#8): no heavy Action on a
# push or a pull request. Before a merge, dispatch this workflow on the pull request's head ref
# (gh workflow run ci.yml --ref <branch>) so its checks attach to the head commit. The seconds-long checks (make check:
# the ranges, the kept-install check's own self-test, the records-candidate check) run on every pull request in lint.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  rpm:
    name: RPM (fc44), built as the release builds it
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: fedora:44
    steps:
      - name: Install the build tools
        run: dnf install -y --setopt=install_weak_deps=False git rpm-build dnf5-plugins make python3
      - uses: actions/checkout@v4
      - uses: Open-Mixer/.github/.github/actions/build-rpm@openmixer-v1

  deb:
    name: DEB (trixie), built and linted as the release builds it
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: debian:trixie
    steps:
      - name: Install the build tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates git dpkg-dev debhelper build-essential lintian python3
      - uses: actions/checkout@v4
      - uses: Open-Mixer/.github/.github/actions/build-deb@openmixer-v1
