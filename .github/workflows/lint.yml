name: lint

# The ONE workflow of this repository that runs on a pull request (delivery pipeline §12: no heavy Action on a push or a
# pull request; Open-Mixer/plugin-hostd-full#8), and never on a push. Seconds-long checks only. The RPM and the DEB are
# ci.yml's, run by workflow_dispatch on the head ref before a merge (gh workflow run ci.yml --ref <branch>); release.yml
# runs on a v* tag and by dispatch.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # the shared trigger gate: every other workflow here runs on a v* tag or by workflow_dispatch, never on a push or a
  # pull request; this file is the one it allows
  trigger-gate:
    name: trigger gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: Open-Mixer/.github/.github/actions/trigger-gate@openmixer-v1
        with:
          lint-workflow: lint.yml

  # the ranges (every dependency a floor and the next minor as its ceiling, the same in the spec and debian/control),
  # the kept-install check's own self-test and the records-candidate check: python and bash over the tree, no install
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: make check

  # the checks every OpenMixer repository runs on what it publishes: commit messages, private references, and no
  # local copy of either (Open-Mixer/.github's public-sources-check)
  public-sources:
    uses: Open-Mixer/.github/.github/workflows/public-sources-check.yml@openmixer-v1
